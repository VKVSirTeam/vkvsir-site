<style>
/* ======================================================================
   DESIGN SETTINGS — change colours / fonts here and the whole page follows
   ====================================================================== */
:root{
  --header-bg-1:#c9eea6; --header-bg-2:#eaf8cf;   /* light green header */
  --title:#0e3a36;                                /* dark teal title text */
  --nav-bg:#111; --nav-text:#fff; --nav-active:#3a3a3a;
  --hero-bg:#0f3b33; --hero-text:#f4f1e6; --gold:#d8b25a;
  --section-bg:#ffffff; --alt-bg:#eef6ea; --text:#1f2a28; --muted:#55615e;
  --accent:#0e6b5c; --btn-text:#fff; --yt:#e62117;
  --font-title:'Archivo',Arial,sans-serif;
  --font-nav:'Oswald','Arial Narrow',sans-serif;
  --font-body:'Lora',Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font-body);color:var(--text);background:var(--section-bg);line-height:1.6}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- Header ---------- */
.site-header{background:linear-gradient(115deg,var(--header-bg-1),var(--header-bg-2) 60%,var(--header-bg-1));padding-top:env(safe-area-inset-top,0)}
.head-row{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding:16px 20px}
.logo img{width:110px;height:auto}
.titles{text-align:center}
.titles h1{font-family:var(--font-title);font-weight:800;color:var(--title);letter-spacing:.14em;font-size:clamp(20px,3.2vw,38px);margin:0;text-decoration:none}
.titles p{font-family:var(--font-title);font-weight:700;color:var(--title);letter-spacing:.1em;font-size:clamp(13px,1.7vw,21px);margin:6px 0 0;line-height:1.35}
.head-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.login{font-family:var(--font-nav);font-size:15px;text-decoration:none;color:var(--title)}
.socials{display:flex;gap:6px}
.socials img{width:30px;height:30px}

/* ---------- Menu ---------- */
.nav{background:var(--nav-bg);position:sticky;top:0;z-index:20}
.nav ul{list-style:none;margin:0 auto;padding:0;display:flex;flex-wrap:wrap;justify-content:center;max-width:1180px}
.nav li{position:relative}
.nav a{display:block;padding:12px 15px;font-family:var(--font-nav);font-size:17px;color:var(--nav-text);text-decoration:none;white-space:nowrap}
.nav a:hover,.nav a[aria-current="page"]{background:var(--nav-active)}
.nav .sub{display:none;position:absolute;top:100%;left:0;background:var(--nav-bg);min-width:250px;flex-direction:column}
.nav li:hover>.sub,.nav li:focus-within>.sub{display:flex}
.menu-toggle{display:none}

/* ---------- Hero ---------- */
.hero{background:var(--hero-bg);color:var(--hero-text);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding-top:50px;padding-bottom:50px}
.glitter{width:240px;opacity:.95}
.hero h2{font-family:var(--font-title);color:var(--gold);font-size:clamp(32px,5vw,56px);margin:10px 0}
.hero .he{font-size:20px;margin:0 0 6px;font-style:italic}
.hero .lines p{margin:2px 0;font-size:clamp(18px,2vw,23px)}
.hero blockquote{margin:22px 0 0;font-style:italic;color:var(--gold);font-size:18px}
.hero-photo{justify-self:center;max-width:420px}
.btn{display:inline-block;background:var(--accent);color:var(--btn-text);font-family:var(--font-nav);font-size:18px;padding:12px 26px;border-radius:30px;text-decoration:none;border:2px solid transparent}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:#1a1a1a}
.btn.yt{background:var(--yt)}

/* ---------- Sections ---------- */
section.block{padding:60px 0}
section.alt{background:var(--alt-bg)}
.block h2{font-family:var(--font-title);color:var(--title);font-size:clamp(26px,3.4vw,40px);margin:0 0 10px;text-align:center}
.block .lead{max-width:760px;margin:0 auto 30px;text-align:center;color:var(--muted)}
.center{text-align:center;margin-top:26px}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.media-grid img{width:100%;height:150px;object-fit:cover;border-radius:6px}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.course{background:#fff;border-radius:8px;overflow:hidden;text-decoration:none;box-shadow:0 2px 10px rgba(14,58,54,.12)}
.course img{width:100%;height:200px;object-fit:cover}
.course span{display:block;padding:14px;font-family:var(--font-nav);font-size:20px;color:var(--title);text-align:center}

/* Views slider — the one deliberate animation on the page */
.slider{position:relative;max-width:420px;margin:0 auto;aspect-ratio:3/4;overflow:hidden;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.slider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.slider img.on{opacity:1}
.dots{display:flex;justify-content:center;gap:8px;margin-top:14px}
.dots button{width:11px;height:11px;border-radius:50%;border:0;background:#b9c9c4;cursor:pointer;padding:0}
.dots button.on{background:var(--accent)}

.fun{position:relative;color:#fff;text-align:center;padding:110px 20px;background:center/cover no-repeat}
.fun::before{content:"";position:absolute;inset:0;background:rgba(10,40,35,.55)}
.fun > *{position:relative}
.fun h2{font-family:var(--font-title);font-size:clamp(30px,5vw,54px);margin:0 0 20px;color:#fff}

.posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.post{background:#fff;border-radius:8px;overflow:hidden;text-decoration:none;box-shadow:0 2px 10px rgba(14,58,54,.12)}
.post img{width:100%;height:190px;object-fit:cover;background:var(--alt-bg)}
.post span{display:block;padding:14px;font-weight:600;color:var(--title)}

.join{background:var(--hero-bg);color:var(--hero-text);text-align:center;padding:60px 20px}
.join h2{font-family:var(--font-title);color:var(--gold);margin:0 0 8px;font-size:clamp(24px,3vw,34px)}
.join p{margin:0 auto 22px;max-width:620px}
footer{background:#0a0a0a;color:#ccc;text-align:center;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0));font-size:14px}

/* ---------- Mobile ---------- */
@media (max-width:820px){
  .head-row{grid-template-columns:auto 1fr;}
  .head-side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .menu-toggle{display:block;width:100%;background:var(--nav-bg);color:#fff;border:0;font-family:var(--font-nav);font-size:18px;padding:12px}
  .nav ul{display:none;flex-direction:column}
  .nav.open ul{display:flex}
  .nav .sub{position:static;display:flex;padding-left:16px}
  .hero .wrap{grid-template-columns:1fr;text-align:center}
  .glitter{margin:0 auto}
}
@media (prefers-reduced-motion:reduce){.slider img{transition:none}html{scroll-behavior:auto}}
</style>
</head>

/* ======================================================================

<nav class="nav" id="nav"><button class="menu-toggle" aria-expanded="false" aria-controls="menu">☰ Menu</button><ul id="menu">${menuHtml}</ul></nav>

/* views slider */
(() => {
  const imgs = [...document.querySelectorAll('#slider img')], dots = [...document.querySelectorAll('#dots button')];
  let i = 0, timer;
  const show = n => { imgs[i].classList.remove('on'); dots[i].classList.remove('on'); i = (n + imgs.length) % imgs.length; imgs[i].classList.add('on'); dots[i].classList.add('on'); };
